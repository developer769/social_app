# Recurring work, loaded by sidekiq-cron in the worker process.
#
# Kept in one file rather than scattered across initializers so that what runs
# on a timer is answerable in one place.
publishing_dispatch:
  cron: "* * * * *"
  class: "Publishing::DispatchDueJob"
  queue: default
  description: "Find posts whose scheduled time has arrived and publish them"

# Quarter-hourly rather than every minute: a comment answered fifteen minutes
# later is fine, and every platform meters how often it may be asked.
inbox_sync:
  cron: "*/15 * * * *"
  class: "Inbox::SyncAllJob"
  queue: default
  description: "Pull comments, messages and reviews from connected accounts"

ad_metrics_sync:
  cron: "20 * * * *"
  class: "Ads::SyncAllJob"
  queue: default
  description: "Pull daily ad figures back from the platforms"

session_sweep:
  cron: "40 3 * * *"
  class: "Sessions::SweepJob"
  queue: default
  description: "Delete sessions that can no longer be used"
