# Redis in development as well as production: broadcasts originate in the
# Sidekiq worker process, and the async adapter is per-process, so a job's
# Turbo Stream would never reach the browser.
development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://redis:6379/1" } %>
  channel_prefix: prachar_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: prachar_production
