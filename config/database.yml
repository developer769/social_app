# Connection details come from discrete environment variables rather than a
# single DATABASE_URL.
#
# DATABASE_URL wins over everything in database.yml, so a single URL in the
# environment silently pointed the test suite at the development database.
# Splitting the parts out keeps one database per environment.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "db") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "prachar") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "prachar") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB_PREFIX", "prachar") %>_development

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB_PREFIX", "prachar") %>_test

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB_PREFIX", "prachar") %>_production
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("POSTGRES_DB_PREFIX", "prachar") %>_production_cache
    migrations_paths: db/cache_migrate
