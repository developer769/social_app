# nginx in front of the app.
#
# Rails is told TLS terminated here (config.assume_ssl), so this must set
# X-Forwarded-Proto -- without it every generated link comes out as http,
# including password reset and email confirmation links, which are credentials.

server {
    listen 80;
    server_name APP_HOST_PLACEHOLDER;

    # Certbot writes its challenge here; everything else goes to https.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # http2 as a listen flag, not the 1.25+ `http2 on;` directive: the
    # deploy target runs nginx 1.18, where that directive is a fatal unknown.
    listen 443 ssl http2;
    server_name APP_HOST_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/APP_HOST_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_HOST_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # MediaAsset allows video up to 200MB (VIDEO_MAX_BYTES), and nginx rejects
    # an oversized body itself -- the request never reaches Rails, so the
    # model's own "is too large" message never gets a chance to explain. This
    # must therefore stay at or above the app's own ceiling, with headroom for
    # multipart framing, or uploads fail with a bare nginx error page.
    client_max_body_size 220m;

    # A 200MB upload over a slow line takes longer than the default 60s.
    client_body_timeout 300s;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 90s;
    }
}
