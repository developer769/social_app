# nginx in front of the app.
#
# Rails is told TLS terminated here (config.assume_ssl), so this must set
# X-Forwarded-Proto -- without it every generated link comes out as http,
# including password reset and email confirmation links, which are credentials.

server {
    listen 80;
    server_name APP_HOST_PLACEHOLDER;

    # Certbot writes its challenge here; everything else goes to https.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name APP_HOST_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/APP_HOST_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_HOST_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Pictures and video, so the limit is not the default 1MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 90s;
    }
}
