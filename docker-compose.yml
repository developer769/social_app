name: prachar

# PostgreSQL and Redis deliberately publish no host ports: this machine already
# runs other database containers, and the app reaches them over the compose
# network by service name anyway.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: prachar-dev
  volumes:
    - .:/app
    - bundle:/usr/local/bundle
    # tmp/ holds the bootsnap compile cache. On the Windows bind mount every
    # cache read crosses the host boundary and boot takes minutes; on a named
    # volume it stays on the VM's own disk.
    - tmp:/app/tmp
  environment: &env
    # Discrete variables, not DATABASE_URL: a single URL overrides
    # database.yml entirely and would point the test suite at the
    # development database.
    POSTGRES_HOST: db
    POSTGRES_USER: prachar
    POSTGRES_PASSWORD: prachar
    POSTGRES_DB_PREFIX: prachar
    REDIS_URL: redis://redis:6379/0
    RAILS_ENV: development
    # A .test domain in development, so an address that escaped this machine
    # would visibly not be a real one.
    MAIL_FROM: Prachar <no-reply@prachar.test>
    MAIL_REPLY_TO: Prachar support <support@prachar.test>
    SMTP_HOST: mailcatcher
    SMTP_PORT: "1025"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prachar
      POSTGRES_PASSWORD: prachar
      POSTGRES_DB_PREFIX: prachar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prachar"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    <<: *app
    # The pid file is cleared before booting. tmp/ is a named volume, so when
    # Docker Desktop is stopped without shutting the container down the pid
    # file survives -- and Puma then refuses to start with "a server is already
    # running", pointing at a process that died with the engine.
    command: sh -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"

  # Tailwind runs as its own process rather than through bin/dev, so Compose
  # restarts it independently and its output stays readable.
  #
  # bin/css-watch polls instead of using tailwindcss --watch: inotify events do
  # not cross the Windows bind mount, so the built stylesheet goes stale without
  # any error being reported.
  css:
    <<: *app
    command: bin/css-watch

  worker:
    <<: *app
    command: bundle exec sidekiq

  # Invitation and notification mail is caught here in development.
  # Web UI: http://localhost:1080
  mailcatcher:
    image: dockage/mailcatcher:0.9.0
    ports:
      - "1080:1080"

volumes:
  pgdata:
  redisdata:
  bundle:
  tmp:
